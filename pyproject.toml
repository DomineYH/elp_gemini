[project]
name = "elp-gemini"
version = "0.1.0"
description = "AI RAG-Based Document Evaluation & QnA Platform"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.121.0",
    "uvicorn[standard]>=0.27.0",
    "jinja2>=3.1.3",
    "httpx>=0.28.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.0.0",
    "python-multipart>=0.0.6",
    "itsdangerous>=2.1.2",
    "email-validator>=2.1.0",
    "google-genai>=1.43.0",
    "google-api-core>=2.11.0",
    "sqlalchemy>=2.0.25",
    "aiosqlite>=0.19.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt<4.0.0",
    "python-dotenv>=1.0.0",
    "tenacity>=8.2.3",
    "greenlet>=3.2.4",
    "pypdf>=3.17.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-mock>=3.12.0",
    "black>=24.0.0",
    "ruff>=0.1.0",
    "mypy>=1.8.0",
]

[tool.black]
line-length = 80
target-version = ['py310']

[tool.ruff]
line-length = 80
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
