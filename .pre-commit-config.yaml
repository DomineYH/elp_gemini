# 설치: uv tool install pre-commit && pre-commit install
# 테스트는 넣지 않는다(전체 2~3분). CI 가 맡는다.
repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: uv run --frozen ruff check
        language: system
        types: [python]
      - id: black
        name: black
        entry: uv run --frozen black --check
        language: system
        types: [python]
      - id: check-emojis
        name: emoji check
        entry: uv run --frozen python scripts/check_no_emojis_in_reports.py
        language: system
        pass_filenames: false
