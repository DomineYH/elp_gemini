{% extends "base.html" %}

{% block title %}로그인{% endblock %}

{% block content %}
<div class="max-w-md mx-auto mt-10">
    <div class="bg-white shadow-md rounded-lg p-8">
        <h2 class="text-2xl font-bold mb-6 text-center">
            로그인
        </h2>

        {% if error %}
        <div
            class="bg-red-100 border border-red-400
            text-red-700 px-4 py-3 rounded mb-4"
            role="alert"
        >
            <p>{{ error }}</p>
        </div>
        {% endif %}

        <form
            method="POST"
            action="/auth/login"
            class="space-y-4"
        >
            <div>
                <label
                    for="username"
                    class="block text-sm font-medium
                    text-gray-700 mb-1"
                >
                    사용자 ID
                </label>
                <input
                    type="text"
                    id="username"
                    name="username"
                    required
                    class="w-full px-3 py-2 border
                    border-gray-300 rounded-md
                    focus:outline-none focus:ring-2
                    focus:ring-blue-500"
                    placeholder="admin"
                />
            </div>

            <div>
                <label
                    for="nickname"
                    class="block text-sm font-medium
                    text-gray-700 mb-1"
                >
                    닉네임
                </label>
                <input
                    type="text"
                    id="nickname"
                    name="nickname"
                    required
                    class="w-full px-3 py-2 border
                    border-gray-300 rounded-md
                    focus:outline-none focus:ring-2
                    focus:ring-blue-500"
                    placeholder="admin"
                />
            </div>

            <button
                type="submit"
                class="w-full bg-blue-600 text-white
                py-2 px-4 rounded-md hover:bg-blue-700
                transition-colors font-medium"
            >
                로그인
            </button>
        </form>

        <div class="mt-6 text-center text-sm text-gray-600">
            <p class="mb-2">
                관리자 계정:
                <code class="bg-gray-100 px-2 py-1 rounded">
                    admin
                </code>
                /
                <code class="bg-gray-100 px-2 py-1 rounded">
                    admin
                </code>
            </p>
            <p class="text-xs text-gray-500">
                💡 ID와 닉네임이 모두 일치하면 기존 사용자로 로그인,
                <br/>
                하나라도 다르면 새로운 사용자로 자동 가입됩니다.
            </p>
        </div>
    </div>
</div>
{% endblock %}
