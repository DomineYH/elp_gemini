{% extends "base.html" %}

{% block title %}로그인{% endblock %}

{% block content %}
<div class="max-w-md mx-auto mt-10">
    <div class="bg-white shadow-md rounded-lg overflow-hidden">
        <div class="p-8">
            <h2 class="text-xl font-bold mb-6 text-center text-gray-800">
                사용자 로그인
            </h2>

            {% if error %}
            <div
                class="bg-red-100 border border-red-400
                text-red-700 px-4 py-3 rounded mb-4"
                role="alert"
            >
                <p>{{ error }}</p>
            </div>
            {% endif %}

            <form
                method="POST"
                action="/auth/login/user"
                class="space-y-4"
            >
                <div>
                    <label
                        for="user_id"
                        class="block text-sm font-medium
                        text-gray-700 mb-2"
                    >
                        아이디
                    </label>
                    <input
                        type="text"
                        id="user_id"
                        name="user_id"
                        value="{{ user_id or '' }}"
                        required
                        maxlength="9"
                        pattern="[A-Za-z0-9]{1,9}"
                        autocomplete="username"
                        inputmode="latin"
                        class="w-full px-3 py-3 border
                        border-gray-300 rounded-md
                        focus:outline-none focus:ring-2
                        focus:ring-blue-500 text-gray-700"
                        placeholder="아이디"
                    />
                </div>

                <div>
                    <label
                        for="password"
                        class="block text-sm font-medium
                        text-gray-700 mb-2"
                    >
                        비밀번호
                    </label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        required
                        autocomplete="current-password"
                        class="w-full px-3 py-3 border
                        border-gray-300 rounded-md
                        focus:outline-none focus:ring-2
                        focus:ring-blue-500 text-gray-700"
                    />
                </div>

                <button
                    type="submit"
                    class="w-full bg-blue-600 text-white
                    py-3 px-4 rounded-md hover:bg-blue-700
                    transition-colors font-medium mt-4"
                >
                    로그인
                </button>
            </form>

            <div class="mt-6 text-center text-sm text-gray-500 space-y-2">
                <p>
                    계정이 없으면 새 아이디로 등록하세요.
                </p>
                <p>
                    <a
                        href="/register"
                        class="text-blue-600 hover:text-blue-700 font-medium"
                    >
                        새 사용자 등록
                    </a>
                </p>
                <p>
                    비밀번호를 잊은 경우 운영 담당자에게 문의하세요.
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
