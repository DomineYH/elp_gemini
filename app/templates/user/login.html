{% extends "base.html" %}

{% block title %}로그인{% endblock %}

{% block content %}
<div class="max-w-md mx-auto mt-10">
    <div class="bg-white shadow-md rounded-lg overflow-hidden">
        <div class="p-8">
            <h2 class="text-xl font-bold mb-6 text-center text-gray-800">
                사용자 로그인
            </h2>

            {% if error %}
            <div
                class="bg-red-100 border border-red-400
                text-red-700 px-4 py-3 rounded mb-4"
                role="alert"
            >
                <p>{{ error }}</p>
            </div>
            {% endif %}

            <form
                method="POST"
                action="/auth/login/user"
                class="space-y-4"
            >
                <div>
                    <label
                        for="user_type"
                        class="block text-sm font-medium
                        text-gray-700 mb-2"
                    >
                        사용자 유형 선택
                    </label>
                    <select
                        id="user_type"
                        name="user_type"
                        required
                        class="w-full px-3 py-3 border
                        border-gray-300 rounded-md
                        focus:outline-none focus:ring-2
                        focus:ring-blue-500
                        bg-white text-gray-700
                        cursor-pointer"
                    >
                        <option value="" disabled selected>
                            -- 선택하세요 --
                        </option>
                        <option value="1학년">1학년</option>
                        <option value="2학년">2학년</option>
                        <option value="3학년">3학년</option>
                        <option value="4학년">4학년</option>
                        <option value="현직교사">현직교사</option>
                    </select>
                </div>

                <div>
                    <label
                        for="invite_code"
                        class="block text-sm font-medium
                        text-gray-700 mb-2"
                    >
                        초대 코드 입력
                    </label>
                    <input
                        type="text"
                        id="invite_code"
                        name="invite_code"
                        required
                        maxlength="6"
                        pattern="[A-Za-z0-9]{6}"
                        class="w-full px-3 py-3 border
                        border-gray-300 rounded-md
                        focus:outline-none focus:ring-2
                        focus:ring-blue-500
                        text-gray-700 uppercase
                        tracking-widest text-center text-lg
                        font-mono"
                        placeholder="예: A3X7K2"
                        oninput="this.value = this.value.toUpperCase()"
                    />
                </div>

                <button
                    type="submit"
                    class="w-full bg-blue-600 text-white
                    py-3 px-4 rounded-md hover:bg-blue-700
                    transition-colors font-medium mt-4"
                >
                    로그인
                </button>
            </form>

            <div class="mt-6 text-center text-sm text-gray-500">
                <p>
                    학년을 선택하고 초대 코드를 입력하세요.
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
