<!-- 국면 패널: /api/simulation/phases/draft로 채우고 window.simPhasePanel.read()로 읽는다 -->
<details class="card p-4 mb-4" id="phasePanel">
    <summary class="cursor-pointer font-medium text-sm" id="phaseSummary">국면 불러오는 중...</summary>
    <p class="note mt-2" id="phaseNotice" role="status"></p>
    <div class="space-y-3 mt-3" id="phaseRows"></div>
    <button type="button" id="phaseAdd"
        class="mt-3 border rounded-lg px-3 py-1.5 text-sm text-gray-700 hover:bg-gray-50 disabled:opacity-50">+ 국면 추가</button>
</details>
<script>
window.simPhasePanel = (() => {
    const MAX = 8;  // PhaseIn 목록 최대 개수
    const panel = document.getElementById("phasePanel");
    const rowsBox = document.getElementById("phaseRows");
    const addBtn = document.getElementById("phaseAdd");
    let phases = [];  // 자료·유의점·원문 발췌는 읽기 전용으로 보여 주고 그대로 돌려보낸다

    function field(label, node) {
        const wrap = document.createElement("label");
        wrap.className = "block text-xs text-gray-500";
        wrap.append(label, node);
        node.className = "mt-1 w-full border rounded-lg px-2 py-1.5 text-sm text-gray-900 bg-white";
        return wrap;
    }

    function readOnly(label, text) {
        const wrap = document.createElement("div");
        wrap.className = "text-xs text-gray-500 sm:col-span-full";
        const body = document.createElement("p");
        body.className = "mt-1 text-sm text-gray-700 whitespace-pre-line break-words";
        body.textContent = text;
        wrap.append(label, body);
        return wrap;
    }

    function render() {
        document.getElementById("phaseSummary").textContent = "국면 " + phases.length + "개 감지 · 수정";
        addBtn.disabled = phases.length >= MAX;
        rowsBox.replaceChildren(...phases.map((p, i) => {
            const row = document.createElement("div");
            row.className = "grid gap-2 sm:grid-cols-[1fr_6rem] lg:grid-cols-[10rem_5rem_1fr_1fr_auto] border-b pb-3";
            const name = document.createElement("input");
            name.value = p.name;
            name.maxLength = 50;
            name.addEventListener("input", () => { p.name = name.value; });
            const minutes = document.createElement("input");
            minutes.type = "number";
            minutes.min = "0";
            minutes.max = "180";
            minutes.value = p.minutes ?? "";
            minutes.addEventListener("input", () => {
                p.minutes = minutes.value === "" ? null : Number(minutes.value);
            });
            const prompt = document.createElement("textarea");
            prompt.rows = 2;
            prompt.maxLength = 2000;
            prompt.value = p.teacher_prompt;
            prompt.addEventListener("input", () => { p.teacher_prompt = prompt.value; });
            const task = document.createElement("textarea");
            task.rows = 2;
            task.maxLength = 2000;
            task.value = p.task;
            task.addEventListener("input", () => { p.task = task.value; });
            const del = document.createElement("button");
            del.type = "button";
            del.className = "self-end border rounded-lg px-3 py-1.5 text-sm text-red-700 hover:bg-red-50 disabled:opacity-50";
            del.textContent = "삭제";
            del.setAttribute("aria-label", "국면 " + (i + 1) + " 삭제");
            del.disabled = phases.length <= 1;
            del.addEventListener("click", () => { phases.splice(i, 1); render(); });
            row.append(
                field("국면 " + (i + 1) + " 이름", name),
                field("시간(분)", minutes),
                field("교사 발문", prompt),
                field("과업", task),
                del,
            );
            if (p.materials) row.append(readOnly("자료", p.materials));
            if (p.cautions) row.append(readOnly("유의점", p.cautions));
            if (p.source_span) row.append(readOnly("원문 발췌", p.source_span));
            return row;
        }));
    }

    addBtn.addEventListener("click", () => {
        phases.push({ name: "", minutes: null, teacher_prompt: "", task: "", materials: "", cautions: "", source_span: "" });
        render();
    });

    async function load() {
        try {
            const res = await fetch("/api/simulation/phases/draft");
            if (!res.ok) throw new Error(res.status);
            const body = await res.json();
            phases = body.phases;
            document.getElementById("phaseNotice").textContent = body.notice || "";
            panel.open = body.source === "fallback";
            render();
        } catch (err) {
            panel.open = true;
            document.getElementById("phaseNotice").textContent = "국면 초안을 불러오지 못했습니다. 새로고침해 주세요.";
        }
    }

    load();
    return {
        // 비어 있는 이름·교사 발문이 있으면 오류 문구를 던진다
        read() {
            const cleaned = phases.map(p => ({ ...p, name: p.name.trim(), teacher_prompt: p.teacher_prompt.trim() }));
            if (!cleaned.length || cleaned.some(p => !p.name || !p.teacher_prompt)) {
                panel.open = true;
                throw new Error("모든 국면의 이름과 교사 발문을 입력해 주세요.");
            }
            return cleaned;
        },
    };
})();
</script>
