{% extends "base.html" %}

{% block title %}사용자 등록{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto mt-10">
    <div class="bg-white shadow-md rounded-lg overflow-hidden">
        <div class="p-8">
            <h2 class="text-xl font-bold mb-6 text-center text-gray-800">
                사용자 등록
            </h2>

            {% if error %}
            <div
                class="bg-red-100 border border-red-400
                text-red-700 px-4 py-3 rounded mb-4"
                role="alert"
            >
                <p>{{ error }}</p>
            </div>
            {% endif %}

            <form
                method="POST"
                action="/auth/register"
                class="space-y-5"
            >
                <div>
                    <label
                        for="email"
                        class="block text-sm font-medium
                        text-gray-700 mb-2"
                    >
                        이메일
                    </label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        value="{{ email or '' }}"
                        required
                        autocomplete="email"
                        class="w-full px-3 py-3 border
                        border-gray-300 rounded-md
                        focus:outline-none focus:ring-2
                        focus:ring-blue-500 text-gray-700"
                        placeholder="you@example.com"
                    />
                </div>

                <fieldset>
                    <legend
                        class="block text-sm font-medium
                        text-gray-700 mb-2"
                    >
                        사용자 유형
                    </legend>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                        <label
                            class="flex items-center gap-2 px-3 py-3
                            border border-gray-300 rounded-md cursor-pointer"
                        >
                            <input
                                type="radio"
                                name="role"
                                value="teacher"
                                {% if selected_role != 'preservice_teacher' %}checked{% endif %}
                                class="text-blue-600"
                            />
                            교사
                        </label>
                        <label
                            class="flex items-center gap-2 px-3 py-3
                            border border-gray-300 rounded-md cursor-pointer"
                        >
                            <input
                                type="radio"
                                name="role"
                                value="preservice_teacher"
                                {% if selected_role == 'preservice_teacher' %}checked{% endif %}
                                class="text-blue-600"
                            />
                            예비교사
                        </label>
                    </div>
                </fieldset>

                <div
                    id="teacher-fields"
                    data-role-section="teacher"
                    class="space-y-4"
                >
                    <div>
                        <label
                            for="teacher_region"
                            class="block text-sm font-medium
                            text-gray-700 mb-2"
                        >
                            지역
                        </label>
                        <select
                            id="teacher_region"
                            name="teacher_region"
                            class="w-full px-3 py-3 border
                            border-gray-300 rounded-md bg-white
                            focus:outline-none focus:ring-2
                            focus:ring-blue-500 text-gray-700"
                        >
                            <option value="">-- 선택하세요 --</option>
                            {% for region in teacher_regions %}
                            <option
                                value="{{ region }}"
                                {% if teacher_region == region %}selected{% endif %}
                            >
                                {{ region }}
                            </option>
                            {% endfor %}
                        </select>
                    </div>

                    <div>
                        <label
                            for="teacher_career_years"
                            class="block text-sm font-medium
                            text-gray-700 mb-2"
                        >
                            경력 연수
                        </label>
                        <input
                            type="number"
                            id="teacher_career_years"
                            name="teacher_career_years"
                            value="{{ teacher_career_years or '' }}"
                            min="0"
                            step="1"
                            class="w-full px-3 py-3 border
                            border-gray-300 rounded-md
                            focus:outline-none focus:ring-2
                            focus:ring-blue-500 text-gray-700"
                            placeholder="예: 5"
                        />
                    </div>
                </div>

                <div
                    id="preservice-fields"
                    data-role-section="preservice_teacher"
                    class="space-y-4"
                >
                    <div>
                        <label
                            for="preservice_university_region"
                            class="block text-sm font-medium
                            text-gray-700 mb-2"
                        >
                            대학교지역
                        </label>
                        <select
                            id="preservice_university_region"
                            name="preservice_university_region"
                            class="w-full px-3 py-3 border
                            border-gray-300 rounded-md bg-white
                            focus:outline-none focus:ring-2
                            focus:ring-blue-500 text-gray-700"
                        >
                            <option value="">-- 선택하세요 --</option>
                            {% for region in preservice_university_regions %}
                            <option
                                value="{{ region }}"
                                {% if preservice_university_region == region %}selected{% endif %}
                            >
                                {{ region }}
                            </option>
                            {% endfor %}
                        </select>
                    </div>

                    <div>
                        <label
                            for="preservice_grade"
                            class="block text-sm font-medium
                            text-gray-700 mb-2"
                        >
                            학년
                        </label>
                        <select
                            id="preservice_grade"
                            name="preservice_grade"
                            class="w-full px-3 py-3 border
                            border-gray-300 rounded-md bg-white
                            focus:outline-none focus:ring-2
                            focus:ring-blue-500 text-gray-700"
                        >
                            <option value="">-- 선택하세요 --</option>
                            {% for grade in [1, 2, 3, 4] %}
                            <option
                                value="{{ grade }}"
                                {% if preservice_grade|string == grade|string %}selected{% endif %}
                            >
                                {{ grade }}학년
                            </option>
                            {% endfor %}
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label
                            for="password"
                            class="block text-sm font-medium
                            text-gray-700 mb-2"
                        >
                            비밀번호
                        </label>
                        <input
                            type="password"
                            id="password"
                            name="password"
                            required
                            minlength="8"
                            autocomplete="new-password"
                            class="w-full px-3 py-3 border
                            border-gray-300 rounded-md
                            focus:outline-none focus:ring-2
                            focus:ring-blue-500 text-gray-700"
                        />
                    </div>

                    <div>
                        <label
                            for="password_confirm"
                            class="block text-sm font-medium
                            text-gray-700 mb-2"
                        >
                            비밀번호 확인
                        </label>
                        <input
                            type="password"
                            id="password_confirm"
                            name="password_confirm"
                            required
                            minlength="8"
                            autocomplete="new-password"
                            class="w-full px-3 py-3 border
                            border-gray-300 rounded-md
                            focus:outline-none focus:ring-2
                            focus:ring-blue-500 text-gray-700"
                        />
                    </div>
                </div>

                <button
                    type="submit"
                    class="w-full bg-blue-600 text-white
                    py-3 px-4 rounded-md hover:bg-blue-700
                    transition-colors font-medium mt-4"
                >
                    등록하고 시작하기
                </button>
            </form>

            <div class="mt-6 text-center text-sm text-gray-500 space-y-2">
                <p>
                    이미 등록했다면
                    <a
                        href="/login{% if email %}?email={{ email|urlencode }}{% endif %}"
                        class="text-blue-600 hover:text-blue-700 font-medium"
                    >로그인</a>
                    하세요.
                </p>
                <p>비밀번호를 잊은 경우 관리자에게 문의하세요.</p>
            </div>
        </div>
    </div>
</div>

<script>
(function () {
    const roleInputs = document.querySelectorAll('input[name="role"]');
    const sections = document.querySelectorAll('[data-role-section]');

    function syncRoleFields() {
        const selected = document.querySelector(
            'input[name="role"]:checked'
        ).value;

        sections.forEach((section) => {
            const active = section.dataset.roleSection === selected;
            section.classList.toggle('hidden', !active);
            section.querySelectorAll('input, select').forEach((field) => {
                if (active) {
                    field.setAttribute('required', 'required');
                } else {
                    field.removeAttribute('required');
                }
            });
        });
    }

    roleInputs.forEach((input) => {
        input.addEventListener('change', syncRoleFields);
    });
    syncRoleFields();
}());
</script>
{% endblock %}
