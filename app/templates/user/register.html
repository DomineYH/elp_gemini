{% extends "base.html" %}

{% block title %}사용자 등록{% endblock %}

{% block content %}
<div class="max-w-md mx-auto mt-10">
    <div class="bg-white shadow-md rounded-lg overflow-hidden">
        <div class="p-8">
            <h2 class="text-xl font-bold mb-6 text-center text-gray-800">
                사용자 등록
            </h2>

            {% if error %}
            <div
                class="bg-red-100 border border-red-400
                text-red-700 px-4 py-3 rounded mb-4"
                role="alert"
            >
                <p>{{ error }}</p>
            </div>
            {% endif %}

            <form
                method="POST"
                action="/auth/register"
                class="space-y-5"
            >
                <div>
                    <label
                        for="user_id"
                        class="block text-sm font-medium
                        text-gray-700 mb-2"
                    >
                        아이디
                    </label>
                    <input
                        type="text"
                        id="user_id"
                        name="user_id"
                        value="{{ user_id or '' }}"
                        required
                        maxlength="9"
                        pattern="[A-Za-z0-9]{1,9}"
                        autocomplete="username"
                        inputmode="latin"
                        class="w-full px-3 py-3 border
                        border-gray-300 rounded-md
                        focus:outline-none focus:ring-2
                        focus:ring-blue-500 text-gray-700"
                        placeholder="영문/숫자 9자 이하"
                    />
                    <p class="mt-1 text-xs text-gray-500">
                        영문과 숫자만, 9자 이하로 입력하세요.
                    </p>
                </div>

                <div>
                    <label
                        for="password"
                        class="block text-sm font-medium
                        text-gray-700 mb-2"
                    >
                        비밀번호
                    </label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        required
                        minlength="8"
                        autocomplete="new-password"
                        class="w-full px-3 py-3 border
                        border-gray-300 rounded-md
                        focus:outline-none focus:ring-2
                        focus:ring-blue-500 text-gray-700"
                    />
                </div>

                <div>
                    <label
                        for="password_confirm"
                        class="block text-sm font-medium
                        text-gray-700 mb-2"
                    >
                        비밀번호 확인
                    </label>
                    <input
                        type="password"
                        id="password_confirm"
                        name="password_confirm"
                        required
                        minlength="8"
                        autocomplete="new-password"
                        class="w-full px-3 py-3 border
                        border-gray-300 rounded-md
                        focus:outline-none focus:ring-2
                        focus:ring-blue-500 text-gray-700"
                    />
                </div>

                <button
                    type="submit"
                    class="w-full bg-blue-600 text-white
                    py-3 px-4 rounded-md hover:bg-blue-700
                    transition-colors font-medium mt-4"
                >
                    등록하고 시작하기
                </button>
            </form>

            <div class="mt-6 text-center text-sm text-gray-500 space-y-2">
                <p>
                    이미 등록했다면
                    <a
                        href="/login"
                        class="text-blue-600 hover:text-blue-700 font-medium"
                    >로그인</a>
                    하세요.
                </p>
                <p>비밀번호를 잊은 경우 관리자에게 문의하세요.</p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
