{# PROTOTYPE (#140) — throwaway. CSS lifted verbatim from refactoring/persona_sim 시안; body padding/height rules dropped because base.html owns body. #}
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#f3f4f6; --surface:#ffffff; --ink:#111827; --muted:#6b7280; --line:#e5e7eb;
  --teacher:#1d4ed8; --teacher-soft:#dbeafe;
  --p1:#be123c; --p1s:#ffe4e6; --p2:#0f766e; --p2s:#ccfbf1; --p3:#b45309; --p3s:#fef3c7; --p4:#6d28d9; --p4s:#ede9fe;
  --ok:#16a34a; --warn:#d97706;
  --font-body:"Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
.sim{font-family:var(--font-body);color:var(--ink)}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.eyebrow{font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500}
.bubble{position:relative;border-radius:14px;padding:.6rem .85rem;font-size:.9rem;line-height:1.5;max-width:100%;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.bubble.p1{background:var(--p1s);border-left:4px solid var(--p1)}
.bubble.p2{background:var(--p2s);border-left:4px solid var(--p2)}
.bubble.p3{background:var(--p3s);border-left:4px solid var(--p3)}
.bubble.p4{background:var(--p4s);border-left:4px solid var(--p4)}
.bubble.teacher{background:var(--teacher);color:#fff;border-radius:16px;padding:.75rem 1.1rem;font-size:.95rem}
.name.p1{color:var(--p1)}.name.p2{color:var(--p2)}.name.p3{color:var(--p3)}.name.p4{color:var(--p4)}
.dot.p1{background:var(--p1)}.dot.p2{background:var(--p2)}.dot.p3{background:var(--p3)}.dot.p4{background:var(--p4)}
.seat{min-width:0}
.seat .bubble{opacity:0;transform:translateY(6px);transition:opacity .25s,transform .25s}
.seat .bubble.in{opacity:1;transform:none}
.phase-pill{font-size:.75rem;padding:.25rem .6rem;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--muted);white-space:nowrap}
.phase-pill.done{background:#ecfdf5;color:#047857;border-color:#a7f3d0}
.phase-pill.now{background:var(--teacher);color:#fff;border-color:var(--teacher)}
.fab{box-shadow:0 10px 25px -5px rgba(0,0,0,.2),0 8px 10px -6px rgba(0,0,0,.1)}
.agree{font-size:.72rem;padding:.15rem .5rem;border-radius:999px;border:1px solid var(--line);color:var(--muted);background:#fff}
.agree.yes{background:#ecfdf5;color:#047857;border-color:#a7f3d0}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--teacher);outline-offset:2px}
.note{font-size:.78rem;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px}
</style>
