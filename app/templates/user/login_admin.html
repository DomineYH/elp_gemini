{% extends "base.html" %}

{% block title %}관리자 로그인{% endblock %}

{% block content %}
<div class="max-w-md mx-auto mt-10">
    <div class="bg-white shadow-md rounded-lg overflow-hidden">
        <div class="p-8">
            <h2 class="text-xl font-bold mb-6 text-center text-gray-800">
                관리자 로그인
            </h2>

            {% if error %}
            <div
                class="bg-red-100 border border-red-400
                text-red-700 px-4 py-3 rounded mb-4"
                role="alert"
            >
                <p>{{ error }}</p>
            </div>
            {% endif %}

            <form
                method="POST"
                action="/auth/login/admin"
                class="space-y-4"
            >
                <input
                    type="hidden"
                    name="csrf_token"
                    value="{{ csrf_token }}"
                />

                <div>
                    <label
                        for="admin_id"
                        class="block text-sm font-medium
                        text-gray-700 mb-1"
                    >
                        관리자 ID
                    </label>
                    <input
                        type="text"
                        id="admin_id"
                        name="admin_id"
                        required
                        class="w-full px-3 py-2 border
                        border-gray-300 rounded-md
                        focus:outline-none focus:ring-2
                        focus:ring-blue-500"
                        placeholder="관리자 ID를 입력하세요"
                    />
                </div>

                <div>
                    <label
                        for="password"
                        class="block text-sm font-medium
                        text-gray-700 mb-1"
                    >
                        비밀번호
                    </label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        required
                        class="w-full px-3 py-2 border
                        border-gray-300 rounded-md
                        focus:outline-none focus:ring-2
                        focus:ring-blue-500"
                        placeholder="비밀번호를 입력하세요"
                    />
                </div>

                <button
                    type="submit"
                    class="w-full bg-blue-600 text-white
                    py-3 px-4 rounded-md hover:bg-blue-700
                    transition-colors font-medium mt-4"
                >
                    로그인
                </button>
            </form>

            <div class="mt-6 text-center text-sm text-gray-500">
                <p>관리자 계정으로 로그인합니다.</p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
