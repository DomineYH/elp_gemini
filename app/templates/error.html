{% extends "base.html" %}

{% block title %}오류 - {{ status_code }}{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto text-center py-20">
    <div class="mb-8">
        <svg
            class="mx-auto h-24 w-24 text-red-500"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
        >
            <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0
                2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333
                -3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"
            />
        </svg>
    </div>

    <h1 class="text-4xl font-bold text-gray-800 mb-4">
        오류가 발생했습니다
    </h1>

    <p
        class="text-6xl font-bold text-red-500 mb-4"
    >
        {{ status_code }}
    </p>

    <p class="text-xl text-gray-600 mb-8">
        {{ detail }}
    </p>

    <a
        href="/"
        class="bg-blue-600 text-white px-6 py-3 rounded-lg
        hover:bg-blue-700 transition-colors inline-block"
    >
        홈으로 돌아가기
    </a>
</div>
{% endblock %}
